name = "edutraceug-marks-worker"
main = "edutraceug-marks-worker.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MAX_FILE_SIZE_MB = "25"

# Secrets (set via `wrangler secret put ...`):
#   ACCOUNT_SERVICE_FIREBASE   — full service account JSON (string)
#   CLOUDINARY_URL             — cloudinary://api_key:api_secret@cloud_name
#   CLOUDMERSIVE_API_KEY       — Cloudmersive API key

# Note: nodejs_compat is required for SheetJS on Workers.
